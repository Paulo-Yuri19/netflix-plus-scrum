<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix+ Registration</title>
    <link rel="stylesheet" href="../styles/register.css">
    <!-- Load bcryptjs from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Create Your Netflix+ Account</h1>
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        minlength="2" 
                        maxlength="100" 
                        placeholder="Enter your full name"
                    >
                    <span class="error-message" id="name-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        autocomplete="email" 
                        placeholder="Enter your email"
                    >
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            minlength="6" 
                            placeholder="At least 6 characters"
                        >
                        <button type="button" id="toggle-password" class="toggle-password">Show</button>
                    </div>
                    <span class="error-message" id="password-error"></span>
                </div>

                <button type="submit" id="submit-button" class="submit-button">Create Account</button>
            </form>
        </div>
    </div>

    <script src="../scripts/register.js"></script>
</body>
</html>
