<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix+ - Criar Perfil</title>
    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #000;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        input {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            margin: 5px;
        }
        .btn-save {
            background-color: #e50914;
            color: white;
        }
        .btn-cancel {
            background-color: #333;
            color: white;
        }
        #error-msg {
            color: #e50914;
            display: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Adicionar Perfil</h1>
        <p>Adicione um perfil para outra pessoa.</p>
        
        <p id="error-msg">Por favor, insira um nome para o perfil.</p>
        
        <input type="text" id="profile-name" placeholder="Nome">
        
        <br>
        <button class="btn-save" onclick="saveProfile()">Salvar</button>
        <button class="btn-cancel" onclick="cancel()">Cancelar</button>
    </div>

    <script src="create-profile.js"></script>
</body>
</html>
